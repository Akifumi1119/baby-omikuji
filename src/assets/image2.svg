<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#5c2200"/><stop offset="100%" stop-color="#2a0d00"/>
    </linearGradient>
    <radialGradient id="sk" cx="44%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#d49858"/><stop offset="100%" stop-color="#7a4818"/>
    </radialGradient>
  </defs>
  <rect width="340" height="440" fill="url(#bg)"/>
  <rect x="12" y="12" width="316" height="416" rx="10" fill="none" stroke="rgba(200,151,58,0.45)" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="140" y="295" width="60" height="42" rx="6" fill="#c09050"/>
  <path d="M152 298 Q149 322 154 334" stroke="rgba(110,60,15,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M188 298 Q191 322 186 334" stroke="rgba(110,60,15,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="60" cy="198" rx="20" ry="26" fill="#c09050"/>
  <ellipse cx="280" cy="198" rx="20" ry="26" fill="#c09050"/>
  <ellipse cx="60" cy="198" rx="12" ry="16" fill="#9a6830"/>
  <ellipse cx="280" cy="198" rx="12" ry="16" fill="#9a6830"/>
  <path d="M54 192 Q59 200 54 210" stroke="rgba(130,70,20,0.45)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M286 192 Q281 200 286 210" stroke="rgba(130,70,20,0.45)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Face -->
  <path d="M170 84 C242 82 284 122 284 172 L281 232 Q273 270 250 282 L210 295 Q170 303 130 295 L90 282 Q67 270 59 232 L56 172 C56 122 98 82 170 84Z" fill="url(#sk)"/>

  <!-- Jaw muscle (more tense for bitter) -->
  <path d="M80 238 Q70 254 80 270" stroke="rgba(115,60,15,0.48)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M260 238 Q270 254 260 270" stroke="rgba(115,60,15,0.48)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Cheekbones -->
  <path d="M246 210 Q262 222 256 240" stroke="rgba(110,58,15,0.5)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M94 210 Q78 222 84 240" stroke="rgba(110,58,15,0.5)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="250" cy="218" rx="22" ry="10" fill="rgba(195,135,62,0.22)" transform="rotate(-20,250,218)"/>
  <ellipse cx="90" cy="218" rx="22" ry="10" fill="rgba(195,135,62,0.22)" transform="rotate(20,90,218)"/>

  <!-- Hair -->
  <path d="M56 172 Q62 108 108 90 Q138 80 170 78 Q202 80 232 90 Q278 108 284 172 Q272 126 232 108 Q202 100 170 99 Q138 100 108 108 Q68 126 56 172Z" fill="#181008"/>
  <path d="M138 84 Q170 78 202 84" stroke="#382e1a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M66 150 Q70 132 80 116" stroke="#9a9080" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45"/>
  <path d="M274 150 Q270 132 260 116" stroke="#9a9080" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45"/>

  <!-- Forehead creases (deeper/more tense) -->
  <path d="M128 140 Q170 134 212 140" stroke="rgba(100,52,14,0.52)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M124 155 Q170 149 216 155" stroke="rgba(100,52,14,0.48)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Deep center crease from furrowing -->
  <path d="M164 168 L168 188" stroke="rgba(100,52,14,0.55)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M176 168 L172 188" stroke="rgba(100,52,14,0.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Heavy brow ridge (more shadow for intense disgust) -->
  <path d="M94 184 Q133 174 170 179 Q207 174 246 184 L249 194 Q210 184 170 188 Q130 184 91 194Z" fill="rgba(85,42,10,0.5)"/>

  <!-- Eyebrows — FURROWED HARD, inner ends sharply DOWN (disgust) -->
  <!-- Left: outer high, inner drops sharply toward nose -->
  <path d="M103 167 Q118 164 132 168 Q146 175 164 183 Q150 187 135 178 Q120 172 103 171Z" fill="#1e1208"/>
  <path d="M105 164 Q128 165 162 182" stroke="#2a1a08" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Right: inner drops sharply -->
  <path d="M176 183 Q194 175 208 168 Q222 164 237 167 Q237 171 222 172 Q205 178 190 187Z" fill="#1e1208"/>
  <path d="M178 182 Q212 165 235 164" stroke="#2a1a08" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Eyes — NARROW SLITS of disgust -->
  <!-- Left eye: narrow open slit -->
  <ellipse cx="133" cy="198" rx="23" ry="8" fill="white" opacity="0.8"/>
  <!-- Iris strip visible -->
  <ellipse cx="133" cy="198" rx="14" ry="6" fill="#3a2010"/>
  <ellipse cx="134" cy="198" rx="8" ry="4" fill="#0e0604"/>
  <ellipse cx="133" cy="198" rx="23" ry="8" fill="none" stroke="#1a0a02" stroke-width="2"/>
  <!-- Lid pressed DOWN hard -->
  <path d="M110 194 Q133 188 156 194" stroke="#1a0a02" stroke-width="4" fill="rgba(35,12,2,0.2)" stroke-linecap="round"/>
  <!-- Lower lid pushed UP -->
  <path d="M111 202 Q133 207 155 202" stroke="#8a5820" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>

  <!-- Right eye: narrow slits -->
  <ellipse cx="207" cy="198" rx="23" ry="8" fill="white" opacity="0.8"/>
  <ellipse cx="207" cy="198" rx="14" ry="6" fill="#3a2010"/>
  <ellipse cx="208" cy="198" rx="8" ry="4" fill="#0e0604"/>
  <ellipse cx="207" cy="198" rx="23" ry="8" fill="none" stroke="#1a0a02" stroke-width="2"/>
  <path d="M184 194 Q207 188 230 194" stroke="#1a0a02" stroke-width="4" fill="rgba(35,12,2,0.2)" stroke-linecap="round"/>
  <path d="M185 202 Q207 207 229 202" stroke="#8a5820" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>

  <!-- Nose -->
  <path d="M163 196 L159 228" stroke="rgba(130,70,18,0.42)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M177 196 L181 228" stroke="rgba(130,70,18,0.42)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="170" cy="234" rx="17" ry="10" fill="rgba(148,78,28,0.3)"/>
  <ellipse cx="154" cy="232" rx="13" ry="9" fill="rgba(108,50,14,0.42)"/>
  <ellipse cx="186" cy="232" rx="13" ry="9" fill="rgba(108,50,14,0.42)"/>
  <path d="M150 236 Q170 246 190 236" stroke="#7a5220" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nasolabial folds (very deep — grimace) -->
  <path d="M148 238 Q134 260 132 275" stroke="rgba(128,68,20,0.58)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M192 238 Q206 260 208 275" stroke="rgba(128,68,20,0.58)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Beard shadow -->
  <ellipse cx="170" cy="270" rx="84" ry="42" fill="rgba(48,36,20,0.3)"/>
  <ellipse cx="122" cy="258" rx="36" ry="24" fill="rgba(48,36,20,0.18)"/>
  <ellipse cx="218" cy="258" rx="36" ry="24" fill="rgba(48,36,20,0.18)"/>

  <!-- Mouth — GRIMACE, twisted, corners down, tense -->
  <!-- Upper lip compressed -->
  <path d="M134 264 Q152 260 164 264 Q170 261 176 264 Q188 260 206 266" stroke="#601e06" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Grimace body -->
  <path d="M136 266 Q152 274 163 268 Q170 271 177 268 Q188 274 204 267" stroke="#601e06" stroke-width="2.5" fill="rgba(70,15,2,0.2)" stroke-linecap="round"/>
  <!-- Corners pulled DOWN hard -->
  <path d="M134 265 Q126 276 129 284" stroke="#601e06" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M206 265 Q214 276 211 284" stroke="#601e06" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Clenched teeth flash -->
  <path d="M142 265 Q160 272 178 266 Q160 275 142 268Z" fill="rgba(240,230,210,0.6)"/>

  <!-- Scar -->
  <path d="M236 228 L242 244" stroke="rgba(210,165,100,0.6)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M234 229 L240 245" stroke="rgba(155,95,38,0.35)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <line x1="40" y1="338" x2="300" y2="338" stroke="rgba(200,151,58,0.4)" stroke-width="1"/>
  <text x="170" y="388" text-anchor="middle" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="38" fill="#f5c842" letter-spacing="14">苦味</text>
  <text x="170" y="418" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(200,151,58,0.55)" letter-spacing="6">BITTER</text>
</svg>
