  <!-- Cheeks -->
  <ellipse cx="112" cy="218" rx="28" ry="17" fill="#ff7070" opacity="0.32"/>
  <ellipse cx="228" cy="218" rx="28" ry="17" fill="#ff7070" opacity="0.32"/>

  <!-- Stars -->
  <text x="82" y="158" font-size="16" fill="rgba(245,200,66,0.65)">✦</text>
  <text x="246" y="152" font-size="13" fill="rgba(245,200,66,0.55)">✦</text>

  <line x1="40" y1="346" x2="300" y2="346" stroke="rgba(200,151,58,0.4)" stroke-width="1"/>
  <text x="170" y="396" text-anchor="middle" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="38" fill="#f5c842" letter-spacing="14">甘味</text>
  <text x="170" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(200,151,58,0.55)" letter-spacing="6">SWEET</text>
