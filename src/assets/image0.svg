<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440">
  <defs>
    <linearGradient id="bg0" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#5c2200"/>
      <stop offset="100%" stop-color="#2a0d00"/>
    </linearGradient>
    <radialGradient id="face0" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fddbb8"/>
      <stop offset="100%" stop-color="#e8a870"/>
    </radialGradient>
  </defs>

  <rect width="340" height="440" fill="url(#bg0)"/>
  <rect x="12" y="12" width="316" height="416" rx="10" fill="none" stroke="rgba(200,151,58,0.45)" stroke-width="1.5"/>

  <!-- Ears -->
  <ellipse cx="72" cy="192" rx="22" ry="26" fill="#fddbb8"/>
  <ellipse cx="268" cy="192" rx="22" ry="26" fill="#fddbb8"/>
  <ellipse cx="72" cy="192" rx="13" ry="16" fill="#e8a870"/>
  <ellipse cx="268" cy="192" rx="13" ry="16" fill="#e8a870"/>

  <!-- Head -->
  <circle cx="170" cy="188" r="100" fill="url(#face0)"/>

  <!-- Hair -->
  <path d="M70 170 Q82 88 170 84 Q258 88 270 170 Q252 108 170 106 Q88 108 70 170z" fill="#3a1e08"/>
  <path d="M170 86 Q175 70 171 60" stroke="#3a1e08" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows relaxed -->
  <path d="M126 157 Q143 149 160 155" stroke="#5a3010" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M180 155 Q197 149 214 157" stroke="#5a3010" stroke-width="3.5" fill="none" stroke-linecap="round"/>

