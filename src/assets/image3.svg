<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#5c2200"/><stop offset="100%" stop-color="#2a0d00"/>
    </linearGradient>
    <radialGradient id="sk" cx="44%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#d49858"/><stop offset="100%" stop-color="#7a4818"/>
    </radialGradient>
  </defs>
  <rect width="340" height="440" fill="url(#bg)"/>
  <rect x="12" y="12" width="316" height="416" rx="10" fill="none" stroke="rgba(200,151,58,0.45)" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="140" y="295" width="60" height="42" rx="6" fill="#c09050"/>
  <path d="M152 298 Q149 322 154 334" stroke="rgba(110,60,15,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M188 298 Q191 322 186 334" stroke="rgba(110,60,15,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="60" cy="198" rx="20" ry="26" fill="#c09050"/>
  <ellipse cx="280" cy="198" rx="20" ry="26" fill="#c09050"/>
  <ellipse cx="60" cy="198" rx="12" ry="16" fill="#9a6830"/>
  <ellipse cx="280" cy="198" rx="12" ry="16" fill="#9a6830"/>
  <path d="M54 192 Q59 200 54 210" stroke="rgba(130,70,20,0.45)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M286 192 Q281 200 286 210" stroke="rgba(130,70,20,0.45)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Face -->
  <path d="M170 84 C242 82 284 122 284 172 L281 232 Q273 270 250 282 L210 295 Q170 303 130 295 L90 282 Q67 270 59 232 L56 172 C56 122 98 82 170 84Z" fill="url(#sk)"/>

  <!-- Jaw muscle (tense with irritation) -->
  <path d="M80 240 Q70 256 80 272" stroke="rgba(115,60,15,0.45)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M260 240 Q270 256 260 272" stroke="rgba(115,60,15,0.45)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Cheekbones -->
  <path d="M246 210 Q262 222 256 240" stroke="rgba(110,58,15,0.5)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M94 210 Q78 222 84 240" stroke="rgba(110,58,15,0.5)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="250" cy="218" rx="22" ry="10" fill="rgba(195,135,62,0.22)" transform="rotate(-20,250,218)"/>
  <ellipse cx="90" cy="218" rx="22" ry="10" fill="rgba(195,135,62,0.22)" transform="rotate(20,90,218)"/>

  <!-- Hair -->
  <path d="M56 172 Q62 108 108 90 Q138 80 170 78 Q202 80 232 90 Q278 108 284 172 Q272 126 232 108 Q202 100 170 99 Q138 100 108 108 Q68 126 56 172Z" fill="#181008"/>
  <path d="M138 84 Q170 78 202 84" stroke="#382e1a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M66 150 Q70 132 80 116" stroke="#9a9080" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45"/>
  <path d="M274 150 Q270 132 260 116" stroke="#9a9080" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45"/>

  <!-- Forehead creases -->
  <path d="M128 140 Q170 134 212 140" stroke="rgba(100,52,14,0.48)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M124 155 Q170 149 216 155" stroke="rgba(100,52,14,0.44)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M167 168 L170 184" stroke="rgba(100,52,14,0.42)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Heavy brow ridge -->
  <path d="M94 184 Q133 176 170 180 Q207 176 246 184 L249 192 Q210 185 170 189 Q130 185 91 192Z" fill="rgba(95,50,14,0.45)"/>

  <!-- Eyebrows — LEFT pressed/angled (irritation), RIGHT sharply arched HIGH (contempt) -->
  <!-- Left brow: pressed and angled inward, lower position -->
  <path d="M103 175 Q118 170 133 169 Q146 173 162 180 Q148 184 133 178 Q118 178 103 179Z" fill="#1e1208"/>
  <path d="M105 172 Q133 169 160 179" stroke="#2a1a08" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Right brow: RAISED HIGH and sharply arched — classic "one eyebrow up" irritation -->
  <path d="M178 161 Q192 150 207 147 Q222 150 237 160 Q222 165 207 162 Q192 167 178 166Z" fill="#1e1208"/>
  <path d="M180 158 Q207 148 235 159" stroke="#2a1a08" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Between-brow crease (asymmetric) -->
  <path d="M163 180 L166 194" stroke="rgba(100,52,14,0.52)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M177 175 L174 190" stroke="rgba(100,52,14,0.38)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eyes — LEFT slightly narrowed (matching pressed brow), RIGHT WIDE OPEN intense stare (raised brow side) -->
  <!-- Left eye: narrowed, sharp -->
  <path d="M108 198 Q133 191 158 198 Q133 206 108 198Z" fill="white"/>
  <circle cx="133" cy="197" r="9.5" fill="#3a2010"/>
  <circle cx="134" cy="197" r="5.8" fill="#0e0604"/>
  <circle cx="136" cy="195" r="2" fill="rgba(255,255,255,0.9)"/>
  <path d="M108 198 Q133 191 158 198" fill="none" stroke="#1a0a02" stroke-width="1.5"/>
  <!-- Lid slightly pressed -->
  <path d="M109 193 Q133 186 157 193" stroke="#1a0a02" stroke-width="4" fill="rgba(30,10,2,0.18)" stroke-linecap="round"/>
  <path d="M110 203 Q133 208 156 203" stroke="#8a5820" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Right eye: WIDE OPEN stare, intense, predatory -->
  <path d="M182 198 Q207 188 232 198 Q207 210 182 198Z" fill="white"/>
  <circle cx="207" cy="196" r="12" fill="#3a2010"/>
  <circle cx="208" cy="196" r="7.5" fill="#0e0604"/>
  <circle cx="210" cy="193" r="2.8" fill="rgba(255,255,255,0.9)"/>
  <path d="M182 198 Q207 188 232 198" fill="none" stroke="#1a0a02" stroke-width="1.5"/>
  <!-- Wide open upper lid — arched high matching raised brow -->
  <path d="M182 192 Q207 181 232 192" stroke="#1a0a02" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Lower lid taut -->
  <path d="M183 205 Q207 212 231 205" stroke="#8a5820" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Inner corner redness (stress/anger) -->
  <circle cx="186" cy="198" r="3" fill="rgba(200,80,60,0.28)"/>

  <!-- Nose -->
  <path d="M163 196 L159 228" stroke="rgba(130,70,18,0.42)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M177 196 L181 228" stroke="rgba(130,70,18,0.42)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="170" cy="234" rx="17" ry="10" fill="rgba(148,78,28,0.3)"/>
  <ellipse cx="154" cy="232" rx="13" ry="9" fill="rgba(108,50,14,0.42)"/>
  <ellipse cx="186" cy="232" rx="13" ry="9" fill="rgba(108,50,14,0.42)"/>
  <path d="M150 236 Q170 246 190 236" stroke="#7a5220" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nasolabial folds -->
  <path d="M148 238 Q136 258 134 272" stroke="rgba(128,68,20,0.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M192 238 Q204 258 206 272" stroke="rgba(128,68,20,0.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Beard shadow -->
  <ellipse cx="170" cy="270" rx="84" ry="42" fill="rgba(48,36,20,0.3)"/>
  <ellipse cx="122" cy="258" rx="36" ry="24" fill="rgba(48,36,20,0.18)"/>
  <ellipse cx="218" cy="258" rx="36" ry="24" fill="rgba(48,36,20,0.18)"/>

  <!-- Mouth — TIGHT contemptuous line, left corner sneer -->
  <path d="M136 265 Q155 261 170 263 Q185 261 204 265" stroke="#601e06" stroke-width="3.5" fill="rgba(65,16,3,0.22)" stroke-linecap="round"/>
  <!-- Left corner sneer (pulled inward/down) -->
  <path d="M136 265 Q128 272 132 280" stroke="#601e06" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Lower lip slight curve -->
  <path d="M138 268 Q170 274 202 268" stroke="#7a3818" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- Jaw set lines at chin -->
  <path d="M155 288 Q170 292 185 288" stroke="rgba(115,60,15,0.3)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Scar -->
  <path d="M236 228 L242 244" stroke="rgba(210,165,100,0.6)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M234 229 L240 245" stroke="rgba(155,95,38,0.35)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <line x1="40" y1="338" x2="300" y2="338" stroke="rgba(200,151,58,0.4)" stroke-width="1"/>
  <text x="170" y="388" text-anchor="middle" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="38" fill="#f5c842" letter-spacing="14">酸味</text>
  <text x="170" y="418" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(200,151,58,0.55)" letter-spacing="6">SOUR</text>
</svg>
